[ESP32_S3_SM]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32-s3-sm
  -D ESP32_CPU_FREQ=80
  -D P_LORA_NSS=10
  -D P_LORA_SCLK=2
  -D P_LORA_MOSI=4
  -D P_LORA_MISO=3
  -D P_LORA_DIO_1=5
  -D P_LORA_BUSY=6
  -D P_LORA_RESET=7
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=9
  -D PIN_GPS_RX=20
  -D PIN_GPS_TX=21
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/esp32-s3-sm>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}

[env:esp32_s3_sm_sx1262_repeater]
extends = ESP32_S3_SM
build_src_filter = ${ESP32_S3_SM.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${ESP32_S3_SM.build_flags}
  -D ENV_INCLUDE_INA3221=1
  -D ADVERT_NAME='"ESP32-C3 Super Mini Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
lib_deps =
  ${ESP32_S3_SM.lib_deps}
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
