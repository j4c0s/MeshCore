[ESP32_C3_SUPERMINI]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32c3_supermini
  -D ESP32_CPU_FREQ=80
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D P_LORA_NSS=10
  -D P_LORA_SCLK=2
  -D P_LORA_MOSI=4
  -D P_LORA_MISO=3
  -D P_LORA_DIO_1=5
  -D P_LORA_BUSY=6
  -D P_LORA_RESET=7
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=9
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/esp32c3_supermini>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}

[env:esp32c3_supermini_sx1262_repeater]
extends = ESP32_C3_SUPERMINI
build_src_filter = ${ESP32_C3_SUPERMINI.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${ESP32_C3_SUPERMINI.build_flags}
  ${sensor_base.build_flags}
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_VL53L0X
  -D ADVERT_NAME='"ESP32-C3 Super Mini Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
lib_deps =
  ${ESP32_C3_SUPERMINI.lib_deps}
  ${sensor_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
